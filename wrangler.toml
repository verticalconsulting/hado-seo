# Hado SEO Cloudflare Worker — https://docs.hadoseo.com/integrations/cloudflare-worker

# The Worker's name in YOUR Cloudflare account — rename it to anything you like.
name = "hado-seo"
main = "src/worker.js"
compatibility_date = "2025-05-05"

# Route the Worker in front of your site — every hostname that serves
# pages. Include www (or any other subdomain) if it serves traffic.
# Replace example.com with your domain in both patterns and zone_name.
# Keep routes above the [vars] section.
routes = [
  { pattern = "verticalconsulting.net/*", zone_name = "verticalconsulting.net" },
  { pattern = "www.verticalconsulting.net/*", zone_name = "verticalconsulting.net" },
  { pattern = "ai.verticalconsulting.net/*", zone_name = "verticalconsulting.net" }
]

[vars]
HADO_RENDER_ENDPOINT = "https://serve.hadoseo.com/v1/render"

# Used by `wrangler preview` (Workers Builds on non-production branches).
# Previews get no HADO_API_KEY secret, so Hado answers 401 and the Worker
# fails open to the origin.
[previews.vars]
HADO_RENDER_ENDPOINT = "https://serve.hadoseo.com/v1/render"

# Your API key is a SECRET, never a [vars] entry (vars are visible in the
# dashboard and in this file):
#   npx wrangler secret put HADO_API_KEY
